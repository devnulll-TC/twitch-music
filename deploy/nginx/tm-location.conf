    # music-бот Азима (twitch-music): панель, OAuth-возврат Twitch, оверлей, WebSocket.
    #
    # Живёт под секретным префиксом на get.dev-nulll.com по той же причине, что и оверлей
    # ai-manhunt выше: это единственная публичная веб-дверь. auth_basic здесь ОТКЛЮЧЁН
    # намеренно — Twitch дёргает OAuth-callback сам и форму логина показать не может,
    # а OBS так же не умеет. Защита пути — длинный случайный префикс.
    #
    # Сам звук идёт МИМО nginx и Cloudflare, прямым портом 8000: круглосуточный поток
    # через free-туннель — лишний прокси на 16 тыс. км и серо по ToS Cloudflare.
    location ^~ /<WEB_PREFIX>/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket для панели и оверлея: без этого «сейчас играет» замрёт.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

# Плюс в /etc/nginx/conf.d/ws-upgrade.conf:
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# (панель сейчас поллит по HTTP раз в 2 сек, WebSocket оставлен на будущее)
